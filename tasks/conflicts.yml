---

# ufw leaves its rules in the kernel when only its service is stopped, and a
# drop in any nftables table is final. `ufw disable` removes them.
- name: conflicts | Read ufw status
  ansible.builtin.command:
    cmd: ufw status
  register: _foomuuri_ufw_status
  changed_when: false
  failed_when: false
  when:
    - ansible_connection not in foomuuri_skip_connections
    - "'ufw.service' in ansible_facts['services']"

- name: conflicts | Disable ufw and remove its rules
  ansible.builtin.command:
    cmd: ufw disable
  changed_when: true
  when:
    - ansible_connection not in foomuuri_skip_connections
    - _foomuuri_ufw_status.stdout is defined
    - "'Status: active' in _foomuuri_ufw_status.stdout"

- name: conflicts | Stop, disable and mask conflicting services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ foomuuri_conflicting_services }}"
  when:
    - ansible_connection not in foomuuri_skip_connections
    - (item ~ '.service') in ansible_facts['services']

# A service that flushes the whole ruleset when it stops, such as a
# distribution's nftables service, removes Foomuuri's table as well.
- name: conflicts | Read the foomuuri table
  ansible.builtin.command:
    cmd: nft list table inet foomuuri
  register: _foomuuri_table
  changed_when: false
  failed_when: false
  when:
    - ansible_connection not in foomuuri_skip_connections

- name: conflicts | Reload foomuuri if its table was removed
  ansible.builtin.service:
    name: foomuuri
    state: reloaded
  when:
    - ansible_connection not in foomuuri_skip_connections
    - _foomuuri_table.rc is defined
    - _foomuuri_table.rc != 0
