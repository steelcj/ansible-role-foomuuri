---
argument_specs:
  main:
    short_description: Build stable nftables firewalls with Foomuuri.
    description:
      - Installs Foomuuri, writes one fragment of configuration per run, checks the whole configuration in a staging directory, then reloads.
      - Several runs with different fragments add to each other.
    author: steelcj
    options:
      foomuuri_fragment:
        type: str
        default: 10-base
        description: Name of the fragment this run writes, such as C(10-base) or C(20-web).
      foomuuri_fragment_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Whether the fragment should exist.
      foomuuri_base_fragment:
        type: str
        default: 10-base
        description: The fragment that holds zones, global options and base rules.
      foomuuri_purge:
        type: str
        default: unmanaged
        choices:
          - unmanaged
          - fragments
          - none
        description: What to remove from the Foomuuri configuration directory.
      foomuuri_keep_fragments:
        type: list
        elements: str
        default: []
        description: With C(foomuuri_purge=fragments), other fragments to keep.
      foomuuri_purge_exclude:
        type: list
        elements: str
        default: []
        description: Full paths that purge never removes.
      foomuuri_disable_conflicting:
        type: bool
        default: true
        description: Stop, disable and mask other firewall services.
      foomuuri_dbus:
        type: bool
        default: false
        description: Run Foomuuri's D-Bus handler. When false, C(foomuuri-dbus.service) is stopped and masked.
      foomuuri_require_ssh:
        type: bool
        default: true
        description: Refuse a configuration with no SSH rule towards localhost.
      foomuuri_minimum_version:
        type: str
        default: "0.22"
        description: Oldest Foomuuri version accepted.
      foomuuri_skip_connections:
        type: list
        elements: str
        default:
          - container
          - docker
          - community.docker.docker
        description: Connections where services and other firewalls are left alone.
      foomuuri_config:
        type: dict
        default: {}
        description: The foomuuri section, option name to value. Base fragment only.
      foomuuri_zones:
        type: dict
        default:
          localhost: []
          public:
            - "*"
        description: The zone section, zone name to a list of interfaces. Base fragment only.
      foomuuri_base_rules:
        type: dict
        description: Rules written to the base fragment before foomuuri_rules. Section name to a list of rule strings.
      foomuuri_rules:
        type: dict
        default: {}
        description: Rules for this fragment. Section name to a list of rule strings.
      foomuuri_macros:
        type: dict
        default: {}
        description: The macro section for this fragment, name to Foomuuri string.
      foomuuri_iplists:
        type: dict
        default: {}
        description: The iplist section for this fragment, name to Foomuuri string.
      foomuuri_templates:
        type: dict
        default: {}
        description: Template sections for this fragment, name to a list of rule strings.
      foomuuri_files:
        type: list
        elements: dict
        default: []
        description: Extra .conf or .nft files owned by this fragment.
        options:
          name:
            type: str
            required: true
            description: File name, ending in .conf or .nft.
          content:
            type: str
            required: true
            description: File content.
